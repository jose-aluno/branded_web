<div class="card">
    <div class="main">
        <img [src]="item().product.imageUrl" [alt]="item().product.name">
        
        <div class="card-info">
            <h3>{{ item().product.name }}</h3>
            
            <div class="bot-row">
                @if(item().product.promo){
                    <div class="preco-group">
                        <span class="preco desconto">
                            {{ item().product.price | promo: 10 | currency:'USD':'symbol': '1.2-2' }}
                        </span>
                        <span class="preco original">
                            {{ item().product.price | currency:'USD':'symbol': '1.2-2' }}
                        </span>
                    </div>
                } @else {
                    <span class="preco">
                        {{ item().product.price | currency:'USD':'symbol': '1.2-2' }}
                    </span>
                }

                <div class="counter">
                    <button (click)="increment()" [disabled]="item().quantity >= item().product.stock">&plus;</button>
                    
                    <p>{{ item().quantity }}</p>
                    
                    <button (click)="decrement()" [disabled]="item().quantity <= 1">&minus;</button>
                </div>
            </div>
        </div>
    </div>

    <button (click)="remove()">
        <img src="/icons/Trash.png" alt="ícone de lixeira">
    </button>
</div>
