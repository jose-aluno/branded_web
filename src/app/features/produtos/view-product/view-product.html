<main>
    <div class="content">
        <img [src]="product()?.imageUrl" [alt]="product()?.name">
        <div class="product-info">
            <h1>{{product()?.name}}</h1>
            <h3>{{product()?.artist}}</h3>
            <p>{{product()?.description}}</p>
            <div class="bot-row">
                @if(true){
                    <div class="preco-group">
                        <span class="preco desconto">{{product()!.price | promo: 10 | currency:'USD':'symbol': '1.2-2'}}</span>
                        <span class="preco original">{{product()!.price | currency:'USD':'symbol': '1.2-2'}}</span>
                    </div>
                }
                @else {
                    <span class="preco">{{product()!.price | currency:'USD':'symbol': '1.2-2'}}</span>
                }

                <div class="counter">
                    <button>&plus;</button>
                    <p>1</p>
                    <button>&minus;</button>
                </div>

            </div>
            <button class="submit">Add to cart</button>
        </div>
    </div>
</main>
<app-footer></app-footer>
