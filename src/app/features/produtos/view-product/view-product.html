<main>
    <div class="content">
        @if(product(); as prod) {
            <img [src]="prod.imageUrl" [alt]="prod.name">
            <div class="product-info">
                <h1>{{prod.name}}</h1>
                <h3>{{prod.artist}}</h3>
                <p>{{prod.description}}</p>
                
                <div class="bot-row">
                    @if(prod.promo){
                        <div class="preco-group">
                            <span class="preco desconto">{{prod.price | promo: 10 | currency:'USD':'symbol': '1.2-2'}}</span>
                            <span class="preco original">{{prod.price | currency:'USD':'symbol': '1.2-2'}}</span>
                        </div>
                    } @else {
                        <span class="preco">{{prod.price | currency:'USD':'symbol': '1.2-2'}}</span>
                    }

                    <div class="counter">
                        <button (click)="increment()" [disabled]="quantity() >= prod.stock">&plus;</button>
                        
                        <p>{{ quantity() }}</p>
                        
                        <button (click)="decrement()" [disabled]="quantity() <= 1">&minus;</button>
                    </div>
                </div>

                <button class="submit" 
                        (click)="addToCart()" 
                        [disabled]="addingToCart() || prod.stock === 0">
                    {{ prod.stock === 0 ? 'Out of Stock' : (addingToCart() ? 'Adding...' : 'Add to cart') }}
                </button>
            </div>
        }
    </div>
</main>
<app-footer></app-footer>
