<div class="content">
    <img src="/images/branded_logo.svg" alt="logo branded">
    <div class="form-wrapper">
        
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
            <h1>Sign in</h1>
            <div class="label-input">
                <label for="login-email">Email</label>
                <input type="text" class="text" id="login-email" formControlName="email" placeholder="Insert your email here...">
            </div>
            <div class="label-input">
                <label for="login-pswd">Password</label>
                <input type="password" class="text" id="login-pswd" formControlName="password" placeholder="Insert your password here...">
            </div>
            
            <button class="submit" type="submit" [disabled]="loginForm.invalid">
                Sign In
            </button>
        </form>
        <div class="stripe"></div>

        <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
            <h1>Create Account</h1>
            <div class="label-input">
                <label for="reg-name">Full Name</label>
                <input type="text" class="text" id="reg-name" formControlName="name" placeholder="Insert your full name here...">
            </div>
            <div class="label-input">
                <label for="reg-email">Email</label>
                <input type="text" class="text" id="reg-email" formControlName="email" placeholder="Insert your email here...">
            </div>
            <div class="label-input">
                <label for="reg-pswd">Password</label>
                <input type="password" class="text" id="reg-pswd" formControlName="password" placeholder="Insert your password here...">
            </div>
            <div class="label-input">
                <label for="reg-pswd-conf">Repeat Password</label>
                <input type="password" class="text" id="reg-pswd-conf" formControlName="confirmPassword" placeholder="Repeat your password here...">
            </div>
            
            <button class="submit" type="submit">Create Account</button>
        </form>
    </div>
</div>
<app-footer></app-footer>
